<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curb Vision</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Fragment+Mono:wght@400&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0C0C0E;
  --surface: #141416;
  --border: rgba(255,255,255,0.06);
  --border-subtle: rgba(255,255,255,0.08);
  --carbon: rgba(255,255,255,0.9);
  --graphite: rgba(255,255,255,0.7);
  --pewter: rgba(255,255,255,0.45);
  --silver: rgba(255,255,255,0.25);
  --cloud: rgba(255,255,255,0.06);
  --blue: #3E6AE1;
  --green: #2D9F6F;
  --yellow: #C4880D;
  --red: #C23B3B;
  --orange: #C06520;
}

body {
  background: #000;
  color: var(--graphite);
  font-family: 'Inter', -apple-system, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  height: 100dvh; overflow: hidden;
  display: flex;
}

/* ---- Layout: feed left, data right ---- */
.feed-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.data-col {
  width: 38%; min-width: 340px; max-width: 540px;
  display: flex; flex-direction: column;
  border-left: 1px solid var(--border);
  overflow: hidden;
  background: var(--bg);
}
@media (max-width: 960px) { .data-col { width: 44%; min-width: 280px; } }

/* ---- Feed ---- */
.feed {
  flex: 1; position: relative;
  display: flex; align-items: center; justify-content: center;
  background: #0C0C0E;
}
.feed canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
#frame-canvas { z-index: 1; }
#overlay-canvas { z-index: 2; }
.feed-empty {
  position: absolute; inset: 0; z-index: 0;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.2); font-size: 13px; font-weight: 500;
  letter-spacing: 0.01em;
}

/* HUD overlays on feed */
.hud-tl, .hud-tr, .hud-bl {
  position: absolute; z-index: 10;
  font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.7);
  font-family: 'Fragment Mono', monospace;
}
.hud-tl { top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; }
.hud-tr { top: 12px; right: 12px; }
.hud-bl { bottom: 12px; left: 12px; }
.hud-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
.hud-dot.on { background: var(--green); }

/* Mapping mode button */
.mapping-btn {
  position: absolute; z-index: 10; top: 12px; right: 80px;
  font-family: 'Fragment Mono', monospace;
  font-size: 10px; font-weight: 500;
  padding: 4px 10px; border-radius: 4px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.6);
  transition: border-color 0.2s, color 0.2s;
}
.mapping-btn:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.8); }
.mapping-btn.active {
  background: rgba(194,59,59,0.25); border-color: var(--red);
  color: var(--red); animation: mappingPulse 2s ease-in-out infinite;
}
@keyframes mappingPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* Sign overlay */
.sign-hud {
  position: absolute; bottom: 12px; left: 12px; right: 12px;
  z-index: 10; display: none;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
  border-radius: 4px; padding: 8px 12px;
  font-size: 12px; font-weight: 500; color: #fff; line-height: 1.5;
}
.sign-hud .dim { color: rgba(255,255,255,0.5); font-weight: 400; }

/* ---- Data column ---- */

/* Stats bar */
.stats-bar {
  display: flex; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg);
}
.stat-cell {
  flex: 1; padding: 12px 8px;
  border-right: 1px solid var(--border);
  text-align: center;
}
.stat-cell:last-child { border-right: none; }
.stat-num {
  font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 500;
  color: var(--carbon); letter-spacing: -0.02em; line-height: 1;
}
.stat-num.blue { color: var(--blue); }
.stat-num.green { color: var(--green); }
.stat-lbl {
  font-size: 9px; font-weight: 500; color: var(--silver);
  text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px;
}

/* Detections strip */
.det-strip {
  border-bottom: 1px solid var(--border);
  padding: 6px 12px;
  flex-shrink: 0;
  display: flex; flex-wrap: wrap; gap: 4px 6px;
  min-height: 28px; max-height: 60px; overflow: hidden;
  align-items: center;
  background: var(--bg);
}
.det-chip {
  font-family: 'Fragment Mono', monospace;
  font-size: 10px; padding: 2px 8px; border-radius: 4px;
  display: inline-flex; align-items: center; gap: 4px;
}
.det-chip.ok { background: rgba(45,159,111,0.12); color: var(--green); }
.det-chip.rej { background: rgba(194,59,59,0.1); color: var(--red); }
.det-chip .pct { opacity: 0.5; }

/* ---- Terminal Log ---- */
.term {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain;
  padding: 4px 0;
  background: var(--bg);
}
.term::-webkit-scrollbar { width: 3px; }
.term::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.line {
  display: flex; gap: 0; padding: 2px 14px;
  font-family: 'Fragment Mono', monospace;
  font-size: 11px; line-height: 1.6;
  animation: lineIn 150ms ease-out;
  align-items: baseline;
}
@media (hover: hover) { .line:hover { background: rgba(255,255,255,0.02); } }
.ts { color: var(--silver); width: 64px; flex-shrink: 0; font-size: 10px; }
.tag { width: 52px; flex-shrink: 0; font-size: 10px; font-weight: 500; }
.tag.vehicle { color: var(--green); }
.tag.gap { color: var(--yellow); }
.tag.sign { color: var(--blue); }
.tag.spot { color: var(--blue); }
.tag.sys { color: var(--silver); }
.tag.rej { color: var(--red); }
.tag.scene { color: var(--pewter); }
.tag.depth { color: var(--orange); }
.msg { color: var(--pewter); flex: 1; min-width: 0; word-break: break-all; }
.msg em { font-style: normal; color: var(--carbon); }
.msg .hi { color: var(--green); }
.msg .warn { color: var(--yellow); }
.msg .err { color: var(--red); }

/* Confirmed flash */
.line.confirmed { background: rgba(62,106,225,0.08); }
.line.confirmed .msg { color: var(--blue); }
.line.confirmed .msg em { color: var(--carbon); }

/* ---- Toast ---- */
.toast {
  position: fixed; top: 16px; left: 50%;
  transform: translateX(-50%) translateY(-4px);
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 10px 20px;
  font-size: 13px; font-weight: 500; color: var(--carbon);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity 0.33s ease, transform 0.33s ease;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes lineIn { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>

<div class="feed-col">
  <div class="feed">
    <div class="feed-empty" id="feed-empty">waiting for stream</div>
    <canvas id="frame-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div class="hud-tl"><div class="hud-dot" id="conn-dot"></div></div>
    <button class="mapping-btn" id="mapping-btn" onclick="toggleMapping()">MAP</button>
    <div class="hud-tr" id="fps-hud">0 fps</div>
    <div class="hud-bl" id="pipeline-hud"></div>
    <div class="sign-hud" id="sign-hud"><span id="sign-text"></span> <span class="dim" id="sign-detail"></span></div>
  </div>
</div>

<div class="data-col">
  <div class="stats-bar">
    <div class="stat-cell"><div class="stat-num" id="s-vehicles">0</div><div class="stat-lbl">Vehicles</div></div>
    <div class="stat-cell"><div class="stat-num green" id="s-gaps">0</div><div class="stat-lbl">Gaps</div></div>
    <div class="stat-cell"><div class="stat-num blue" id="s-signs">0</div><div class="stat-lbl">Signs</div></div>
    <div class="stat-cell"><div class="stat-num blue" id="s-spots">0</div><div class="stat-lbl">Spots</div></div>
    <div class="stat-cell"><div class="stat-num" id="s-frames">0</div><div class="stat-lbl">Frames</div></div>
  </div>

  <div class="det-strip" id="det-strip">
    <span style="color:var(--silver);font-size:10px;">no detections</span>
  </div>

  <div class="term" id="term"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const frameC = document.getElementById('frame-canvas');
const overC = document.getElementById('overlay-canvas');
const fCtx = frameC.getContext('2d');
const oCtx = overC.getContext('2d');

const connDot = document.getElementById('conn-dot');
const feedEmpty = document.getElementById('feed-empty');
const pipeHud = document.getElementById('pipeline-hud');
const fpsHud = document.getElementById('fps-hud');
const signHud = document.getElementById('sign-hud');
const detStrip = document.getElementById('det-strip');
const term = document.getElementById('term');
const toast = document.getElementById('toast');

let ws, reconnect = 1000, frameCount = 0, totalFrames = 0, confirmedCount = 0;
let lastFpsTime = performance.now(), ready = false;
const MAX_LINES = 500;
let lineCount = 0;
let signHudTimer = null;

// Protocol: binary(frame JPEG) -> text(JSON)
let pendingFrame = null;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/viewer`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    connDot.classList.add('on');
    reconnect = 1000;
    emit('sys', 'connected to pipeline server');
  };

  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) {
      const bytes = new Uint8Array(e.data);
      if (bytes.length > 1) {
        const blob = new Blob([e.data], { type: 'image/jpeg' });
        pendingFrame = createImageBitmap(blob);
      } else {
        pendingFrame = null;
      }
    } else {
      try {
        const d = JSON.parse(e.data);
        const fp = pendingFrame;
        pendingFrame = null;

        (fp ? fp : Promise.resolve(null)).then((frameBmp) => {
          if (frameBmp) showFrame(frameBmp);
          if (ready) render(d);
        });
      } catch (err) { console.error('render error:', err); }
    }
  };

  ws.onclose = () => {
    connDot.classList.remove('on');
    emit('sys', 'disconnected, retrying');
    setTimeout(connect, reconnect);
    reconnect = Math.min(reconnect * 2, 16000);
  };
  ws.onerror = () => ws.close();
}

function showFrame(bmp) {
  if (frameC.width !== bmp.width || frameC.height !== bmp.height) {
    frameC.width = bmp.width; frameC.height = bmp.height;
    overC.width = bmp.width; overC.height = bmp.height;
  }
  fCtx.drawImage(bmp, 0, 0);
  feedEmpty.style.display = 'none';
  ready = true;
  frameCount++; totalFrames++;
  document.getElementById('s-frames').textContent = totalFrames;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fpsHud.textContent = frameCount + ' fps';
    frameCount = 0; lastFpsTime = now;
  }
}

// ---- Render overlays on camera feed ----
function render(d) {
  if (!ready) return;
  const W = overC.width, H = overC.height;
  oCtx.clearRect(0, 0, W, H);

  // Raw detections
  if (d.raw_detections && d.raw_detections.length > 0) {
    for (const r of d.raw_detections) {
      const [x1,y1,x2,y2] = r.bbox;
      const w = x2-x1, h = y2-y1;
      if (r.accepted) {
        oCtx.fillStyle = 'rgba(255,255,255,0.03)';
        oCtx.fillRect(x1,y1,w,h);
        oCtx.strokeStyle = 'rgba(255,255,255,0.5)';
        oCtx.lineWidth = 1; oCtx.setLineDash([]);
      } else {
        oCtx.strokeStyle = 'rgba(255,255,255,0.12)';
        oCtx.lineWidth = 1; oCtx.setLineDash([3,3]);
      }
      oCtx.strokeRect(x1,y1,w,h);
      oCtx.setLineDash([]);
      const conf = ((r.confidence*100)|0)+'%';
      const lbl = r.cls + ' ' + conf;
      oCtx.font = '500 9px Inter, sans-serif';
      const tw = oCtx.measureText(lbl).width;
      const ly = y1 > 14 ? y1 - 3 : y1 + 11;
      oCtx.fillStyle = 'rgba(0,0,0,0.6)';
      rr(oCtx, x1, ly - 10, tw + 8, 13, 2); oCtx.fill();
      oCtx.fillStyle = r.accepted ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.35)';
      oCtx.fillText(lbl, x1 + 4, ly);
    }
  }

  // Tracked vehicles — track ID + depth
  if (d.vehicles) {
    document.getElementById('s-vehicles').textContent = d.vehicles.length;
    d.vehicles.forEach(v => {
      const [x1,y1,x2,y2] = v.bbox;
      let parts = [];
      if (v.track_id) parts.push('#' + v.track_id);
      if (v.depth_m != null) parts.push(v.depth_m.toFixed(1) + 'm');
      const lbl = parts.join(' ');
      if (!lbl) return;

      oCtx.font = '500 10px Inter, sans-serif';
      const tw = oCtx.measureText(lbl).width;
      oCtx.fillStyle = 'rgba(0,0,0,0.65)';
      rr(oCtx, x2-tw-10, y1, tw+10, 16, 2); oCtx.fill();
      oCtx.fillStyle = v.depth_m != null ? '#F0A050' : 'rgba(255,255,255,0.8)';
      oCtx.fillText(lbl, x2-tw-5, y1+12);
    });
  }

  // Signs — blue accent overlay
  if (d.signs) {
    document.getElementById('s-signs').textContent = d.signs.length;
    d.signs.forEach(s => {
      const [x1,y1,x2,y2] = s.bbox;
      oCtx.strokeStyle = 'rgba(62,106,225,0.6)';
      oCtx.lineWidth = 1.5; oCtx.setLineDash([]);
      oCtx.strokeRect(x1,y1,x2-x1,y2-y1);
      oCtx.font = '500 9px Inter, sans-serif';
      oCtx.fillStyle = 'rgba(0,0,0,0.6)';
      rr(oCtx, x1, y1-13, 30, 13, 2); oCtx.fill();
      oCtx.fillStyle = 'rgba(62,106,225,0.9)';
      oCtx.fillText('sign', x1+4, y1-2);
    });
  }

  // Tracked gaps
  if (d.tracked_gaps && d.tracked_gaps.length > 0) {
    let open = 0;
    d.tracked_gaps.forEach(g => {
      const [x1,y1,x2,y2] = g.bbox;
      if (g.confirmed) {
        open++;
        oCtx.fillStyle = 'rgba(62,106,225,0.06)';
        oCtx.fillRect(x1,y1,x2-x1,y2-y1);
        oCtx.strokeStyle = 'rgba(62,106,225,0.5)';
        oCtx.lineWidth = 1.5; oCtx.setLineDash([]);
      } else {
        oCtx.strokeStyle = 'rgba(255,255,255,0.2)';
        oCtx.lineWidth = 1; oCtx.setLineDash([4,3]);
      }
      oCtx.strokeRect(x1,y1,x2-x1,y2-y1);
      oCtx.setLineDash([]);

      const cx=(x1+x2)/2, cy=(y1+y2)/2;
      oCtx.textAlign='center'; oCtx.font='500 11px Inter, sans-serif';
      if (g.confirmed) {
        let label = 'OPEN';
        if (g.median_width_meters != null) {
          const w = g.median_width_meters;
          label = w.toFixed(1) + 'm';
          const fit = w < 5.0 ? 'tight' : w < 6.0 ? 'sedan' : 'SUV+';
          oCtx.fillStyle='rgba(255,255,255,0.85)';
          oCtx.fillText(label, cx, cy);
          oCtx.font='500 9px Inter, sans-serif';
          oCtx.fillStyle='rgba(255,255,255,0.45)';
          oCtx.fillText(fit, cx, cy+14);
        } else {
          oCtx.fillStyle='rgba(255,255,255,0.85)';
          oCtx.fillText(label, cx, cy+4);
        }
      } else {
        oCtx.fillStyle='rgba(255,255,255,0.5)';
        oCtx.fillText(g.duration.toFixed(1)+'s',cx,cy+4);
      }
      oCtx.textAlign='start';
    });
    document.getElementById('s-gaps').textContent = open;
  } else if (d.gap_bboxes) {
    oCtx.strokeStyle='rgba(255,255,255,0.1)'; oCtx.lineWidth=1; oCtx.setLineDash([3,3]);
    d.gap_bboxes.forEach(g=>{const[x1,y1,x2,y2]=g;oCtx.strokeRect(x1,y1,x2-x1,y2-y1);});
    oCtx.setLineDash([]);
  }

  // Pipeline state
  if (d.pipeline_state) pipeHud.textContent = d.pipeline_state;

  // GPS
  if (d.lat && d.lng) {
    const depthTag = d.used_depth ? ' <span class="hi">depth</span>' : '';
    const segTag = d.used_segmentation ? ' <span class="hi">seg</span>' : '';
    emit('scene', `frame at <em>${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</em>${segTag}${depthTag}  scene:${d.scene_valid?'<span class="hi">valid</span>':'<span class="err">invalid</span>'}  pipeline:<em>${d.pipeline_state||'\u2014'}</em>`);
  }

  // Detection chips
  if (d.raw_detections && d.raw_detections.length > 0) {
    let chips = '';
    for (const r of d.raw_detections) {
      const c = r.accepted ? 'ok' : 'rej';
      chips += `<span class="det-chip ${c}">${esc(r.cls)} <span class="pct">${(r.confidence*100)|0}%</span></span>`;
    }
    detStrip.innerHTML = chips;
  }

  // Depth log
  if (d.vehicles && d.used_depth && totalFrames % 5 === 0) {
    const withDepth = d.vehicles.filter(v => v.depth_m != null);
    if (withDepth.length > 0) {
      const depthStr = withDepth.map(v => `T${v.track_id||'?'}:<em>${v.depth_m.toFixed(1)}m</em>`).join(' ');
      emit('depth', depthStr);
    }
  }

  // Tracked gaps log
  if (d.tracked_gaps) {
    for (const g of d.tracked_gaps) {
      if (g.confirmed) {
        const w = g.median_width_meters ? g.median_width_meters.toFixed(1)+'m' : '\u2014';
        emit('gap', `gap T${g.left_track_id}\u2013T${g.right_track_id} <span class="hi">CONFIRMED</span>  width:<em>${w}</em>  dur:${g.duration.toFixed(1)}s`);
      } else {
        emit('gap', `gap T${g.left_track_id}\u2013T${g.right_track_id}  accumulating <span class="warn">${g.duration.toFixed(1)}s</span>/2.0s`);
      }
    }
  }

  // Sign rules HUD
  const sr = d.sign_rules;
  if (sr && (sr.combined_summary || sr.summary)) {
    const txt = sr.combined_summary || sr.summary;
    document.getElementById('sign-text').textContent = txt;
    const parts = [sr.combined_hours||sr.hours, sr.combined_price||sr.price].filter(Boolean);
    document.getElementById('sign-detail').textContent = parts.join(' \u00b7 ');
    signHud.style.display = 'block';
    if (signHudTimer) clearTimeout(signHudTimer);
    signHudTimer = setTimeout(() => { signHud.style.display = 'none'; signHudTimer = null; }, 10000);
    emit('sign', `sign decoded: <em>${esc(txt)}</em>`);
  }

  // Confirmed
  if (d.confirmed_block) {
    confirmedCount++;
    document.getElementById('s-spots').textContent = confirmedCount;
    const cb = d.confirmed_block;
    emit('spot', `<em>SPOT CONFIRMED</em>  gaps:<span class="hi">${cb.gap_count}</span>  segment:<em>${esc(cb.segment_id)}</em>  at ${cb.lat?.toFixed(5)},${cb.lng?.toFixed(5)}`, true);
    const seedTag = mappingMode ? ' [SEED]' : '';
    showToast('SPOT CONFIRMED' + seedTag + ' \u2014 ' + cb.gap_count + ' gap' + (cb.gap_count>1?'s':''));
  }
}

// ---- Terminal ----
function emit(tag, msg, highlight) {
  const now = new Date();
  const ts = now.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const ms = String(now.getMilliseconds()).padStart(3,'0').slice(0,1);
  const el = document.createElement('div');
  el.className = 'line' + (highlight ? ' confirmed' : '');
  el.innerHTML = `<span class="ts">${ts}.${ms}</span><span class="tag ${tag}">${tag}</span><span class="msg">${msg}</span>`;
  term.appendChild(el);
  lineCount++;
  while (lineCount > MAX_LINES) { term.removeChild(term.firstChild); lineCount--; }
  term.scrollTop = term.scrollHeight;
}

// ---- Mapping mode ----
let mappingMode = false;
const mappingBtn = document.getElementById('mapping-btn');

async function toggleMapping() {
  try {
    const res = await fetch('/v1/mapping/toggle', { method: 'POST' });
    const data = await res.json();
    mappingMode = data.mapping_mode;
    mappingBtn.classList.toggle('active', mappingMode);
    mappingBtn.textContent = mappingMode ? 'MAPPING' : 'MAP';
    emit('sys', mappingMode
      ? '<span class="warn">MAPPING MODE ON</span> — spots saved as permanent seed'
      : 'mapping mode off');
    showToast(mappingMode ? 'MAPPING MODE ON' : 'Mapping mode off');
  } catch (e) {
    emit('sys', '<span class="err">failed to toggle mapping mode</span>');
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('on');
  setTimeout(() => toast.classList.remove('on'), 3000);
}

// Check initial mapping state on load
fetch('/v1/mapping/status').then(r => r.json()).then(d => {
  mappingMode = d.mapping_mode;
  if (mappingMode) {
    mappingBtn.classList.add('active');
    mappingBtn.textContent = 'MAPPING';
  }
}).catch(() => {});

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

connect();
