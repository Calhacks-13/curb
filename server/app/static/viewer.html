<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curb — Pipeline Monitor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fragment+Mono:wght@400&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0a0a0a;
  --surface: #111113;
  --border: rgba(255,255,255,0.06);
  --text: rgba(255,255,255,0.85);
  --dim: rgba(255,255,255,0.35);
  --faint: rgba(255,255,255,0.15);
  --green: #34d399;
  --yellow: #fbbf24;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --red: #f87171;
  --cyan: #22d3ee;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Fragment Mono', 'SF Mono', 'Fira Code', monospace;
  -webkit-font-smoothing: antialiased;
  height: 100dvh; overflow: hidden;
  display: flex;
}

/* ── Layout: feed left, data right ── */
.feed-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.data-col {
  width: 38%; min-width: 320px; max-width: 520px;
  display: flex; flex-direction: column;
  border-left: 1px solid var(--border);
  overflow: hidden;
}
@media (max-width: 960px) { .data-col { width: 44%; min-width: 260px; } }

/* ── Feed ── */
.feed {
  flex: 1; position: relative;
  display: flex; align-items: center; justify-content: center;
  background: #000;
}
.feed canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
#frame-canvas { z-index: 1; }
#overlay-canvas { z-index: 2; }
.feed-empty {
  position: absolute; inset: 0; z-index: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--faint); font-size: 12px;
  letter-spacing: 0.05em;
}

/* HUD overlays on feed */
.hud-tl, .hud-tr, .hud-bl {
  position: absolute; z-index: 10;
  font-size: 10px; color: var(--dim);
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(4px);
  padding: 3px 8px; border-radius: 4px;
}
.hud-tl { top: 10px; left: 10px; display: flex; align-items: center; gap: 6px; }
.hud-tr { top: 10px; right: 10px; }
.hud-bl { bottom: 10px; left: 10px; }
.hud-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--red); }
.hud-dot.on { background: var(--green); box-shadow: 0 0 6px rgba(52,211,153,0.4); }

/* Sign overlay */
.sign-hud {
  position: absolute; bottom: 10px; left: 10px; right: 10px;
  z-index: 10; display: none;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 6px; padding: 6px 10px;
  font-size: 11px; color: var(--cyan); line-height: 1.4;
}
.sign-hud .dim { color: var(--dim); }

/* ── Data column ── */

/* Stats bar */
.stats-bar {
  display: flex; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.stat-cell {
  flex: 1; padding: 10px 8px;
  border-right: 1px solid var(--border);
  text-align: center;
}
.stat-cell:last-child { border-right: none; }
.stat-num { font-size: 20px; color: var(--text); letter-spacing: -0.02em; line-height: 1; }
.stat-num.green { color: var(--green); }
.stat-num.blue { color: var(--blue); }
.stat-num.purple { color: var(--purple); }
.stat-lbl { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }

/* Detections strip */
.det-strip {
  border-bottom: 1px solid var(--border);
  padding: 6px 10px;
  flex-shrink: 0;
  display: flex; flex-wrap: wrap; gap: 3px 6px;
  min-height: 28px; max-height: 72px; overflow: hidden;
  align-items: center;
}
.det-chip {
  font-size: 10px; padding: 1px 6px; border-radius: 3px;
  display: inline-flex; align-items: center; gap: 4px;
}
.det-chip.ok { background: rgba(52,211,153,0.1); color: var(--green); }
.det-chip.rej { background: rgba(248,113,113,0.08); color: var(--red); }
.det-chip .pct { opacity: 0.6; }

/* ── Terminal Log ── */
.term {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain;
  padding: 6px 0;
}
.term::-webkit-scrollbar { width: 3px; }
.term::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }

.line {
  display: flex; gap: 0; padding: 1px 14px;
  font-size: 11px; line-height: 1.5;
  animation: lineIn 150ms ease-out;
  align-items: baseline;
}
.line:hover { background: rgba(255,255,255,0.02); }
.ts { color: var(--faint); width: 64px; flex-shrink: 0; font-size: 10px; }
.tag { width: 52px; flex-shrink: 0; font-size: 10px; }
.tag.vehicle { color: var(--green); }
.tag.gap { color: var(--yellow); }
.tag.sign { color: var(--purple); }
.tag.spot { color: var(--cyan); }
.tag.sys { color: var(--dim); }
.tag.rej { color: var(--red); }
.tag.scene { color: var(--blue); }
.msg { color: var(--dim); flex: 1; min-width: 0; word-break: break-all; }
.msg em { font-style: normal; color: var(--text); }
.msg .hi { color: var(--green); }
.msg .warn { color: var(--yellow); }
.msg .err { color: var(--red); }

/* Confirmed flash */
.line.confirmed {
  background: rgba(52,211,153,0.06);
}
.line.confirmed .msg { color: var(--green); }
.line.confirmed .msg em { color: #fff; }

/* ── Toast ── */
.toast {
  position: fixed; top: 16px; left: 50%;
  transform: translateX(-50%) translateY(-4px);
  background: rgba(52,211,153,0.12);
  border: 1px solid rgba(52,211,153,0.2);
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 12px; color: var(--green);
  z-index: 200; opacity: 0; pointer-events: none;
  transition: opacity 200ms ease, transform 200ms ease;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes lineIn { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
</style>
</head>
<body>

<div class="feed-col">
  <div class="feed">
    <div class="feed-empty" id="feed-empty">waiting for stream...</div>
    <canvas id="frame-canvas"></canvas>
    <canvas id="overlay-canvas"></canvas>
    <div class="hud-tl"><div class="hud-dot" id="conn-dot"></div><span id="conn-label">connecting</span></div>
    <div class="hud-tr" id="fps-hud">0 fps</div>
    <div class="hud-bl" id="pipeline-hud"></div>
    <div class="sign-hud" id="sign-hud"><span id="sign-text"></span> <span class="dim" id="sign-detail"></span></div>
  </div>
</div>

<div class="data-col">
  <div class="stats-bar">
    <div class="stat-cell"><div class="stat-num" id="s-vehicles">0</div><div class="stat-lbl">Vehicles</div></div>
    <div class="stat-cell"><div class="stat-num green" id="s-gaps">0</div><div class="stat-lbl">Gaps</div></div>
    <div class="stat-cell"><div class="stat-num blue" id="s-signs">0</div><div class="stat-lbl">Signs</div></div>
    <div class="stat-cell"><div class="stat-num green" id="s-spots">0</div><div class="stat-lbl">Spots</div></div>
    <div class="stat-cell"><div class="stat-num" id="s-frames">0</div><div class="stat-lbl">Frames</div></div>
  </div>

  <div class="det-strip" id="det-strip">
    <span style="color:var(--faint);font-size:10px;">no detections</span>
  </div>

  <div class="term" id="term"></div>
</div>

<div class="toast" id="toast" id="toast-msg"></div>

<script>
const frameC = document.getElementById('frame-canvas');
const overC = document.getElementById('overlay-canvas');
const fCtx = frameC.getContext('2d');
const oCtx = overC.getContext('2d');

const connDot = document.getElementById('conn-dot');
const connLabel = document.getElementById('conn-label');
const feedEmpty = document.getElementById('feed-empty');
const pipeHud = document.getElementById('pipeline-hud');
const fpsHud = document.getElementById('fps-hud');
const signHud = document.getElementById('sign-hud');
const detStrip = document.getElementById('det-strip');
const term = document.getElementById('term');
const toast = document.getElementById('toast');

let ws, reconnect = 1000, frameCount = 0, totalFrames = 0, confirmedCount = 0;
let lastFpsTime = performance.now(), lastFrameTime = null, ready = false;
const MAX_LINES = 500;
let lineCount = 0;
let signHudTimer = null;

// Queued frame pair: bitmap decode is async, so we hold the pending
// bitmap promise and render overlay only AFTER the frame is on-canvas.
let pendingBitmap = null; // Promise<ImageBitmap>

// ── Connection ──
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/viewer`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    connDot.classList.add('on');
    connLabel.textContent = 'live';
    reconnect = 1000;
    emit('sys', 'connected to pipeline server');
  };
  ws.onmessage = (e) => {
    if (e.data instanceof ArrayBuffer) {
      lastFrameTime = performance.now();
      const blob = new Blob([e.data], { type: 'image/jpeg' });
      pendingBitmap = createImageBitmap(blob);
    } else {
      // JSON metadata — wait for the bitmap, then draw both together
      try {
        const d = JSON.parse(e.data);
        const bmpPromise = pendingBitmap;
        pendingBitmap = null;
        if (bmpPromise) {
          bmpPromise.then(bmp => { showFrame(bmp); render(d); });
        } else if (ready) {
          render(d);
        }
      } catch (err) { console.error('render error:', err); }
    }
  };
  ws.onclose = () => {
    connDot.classList.remove('on');
    connLabel.textContent = 'reconnecting';
    emit('sys', 'disconnected, retrying...');
    setTimeout(connect, reconnect);
    reconnect = Math.min(reconnect * 2, 16000);
  };
  ws.onerror = () => ws.close();
}

function showFrame(bmp) {
  if (frameC.width !== bmp.width || frameC.height !== bmp.height) {
    frameC.width = bmp.width; frameC.height = bmp.height;
    overC.width = bmp.width; overC.height = bmp.height;
  }
  fCtx.drawImage(bmp, 0, 0);
  feedEmpty.style.display = 'none';
  ready = true;
  frameCount++; totalFrames++;
  document.getElementById('s-frames').textContent = totalFrames;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fpsHud.textContent = frameCount + ' fps';
    frameCount = 0; lastFpsTime = now;
  }
}

// ── Render ──
function render(d) {
  if (!ready) return;
  const W = overC.width, H = overC.height;
  oCtx.clearRect(0, 0, W, H);

  // Raw detections — draw ALL objects YOLO sees (accepted + rejected)
  if (d.raw_detections && d.raw_detections.length > 0) {
    for (const r of d.raw_detections) {
      const [x1,y1,x2,y2] = r.bbox;
      const w = x2-x1, h = y2-y1;
      if (r.accepted) {
        // Accepted vehicle — solid green
        oCtx.fillStyle = 'rgba(52,211,153,0.06)';
        oCtx.fillRect(x1,y1,w,h);
        oCtx.strokeStyle = 'rgba(52,211,153,0.6)';
        oCtx.lineWidth = 1.5; oCtx.setLineDash([]);
      } else {
        // Rejected — dim dashed outline
        oCtx.strokeStyle = 'rgba(248,113,113,0.25)';
        oCtx.lineWidth = 1; oCtx.setLineDash([3,3]);
      }
      oCtx.strokeRect(x1,y1,w,h);
      oCtx.setLineDash([]);
      // Label
      const conf = ((r.confidence*100)|0)+'%';
      const lbl = r.cls + ' ' + conf;
      oCtx.font = '400 9px "Fragment Mono", monospace';
      const tw = oCtx.measureText(lbl).width;
      const ly = y1 > 14 ? y1 - 2 : y1 + 11;
      const lx = x1;
      oCtx.fillStyle = 'rgba(0,0,0,0.55)';
      rr(oCtx, lx, ly - 10, tw + 6, 12, 2); oCtx.fill();
      oCtx.fillStyle = r.accepted ? 'rgba(52,211,153,0.9)' : 'rgba(248,113,113,0.55)';
      oCtx.fillText(lbl, lx + 3, ly);
    }
  }

  // Tracked vehicles — overlay track IDs on accepted vehicles
  if (d.vehicles) {
    document.getElementById('s-vehicles').textContent = d.vehicles.length;
    d.vehicles.forEach(v => {
      if (v.track_id) {
        const [x1,y1,x2,y2] = v.bbox;
        const lbl = '#' + v.track_id;
        oCtx.font = '400 10px "Fragment Mono", monospace';
        const tw = oCtx.measureText(lbl).width;
        oCtx.fillStyle = 'rgba(0,0,0,0.6)';
        rr(oCtx, x2-tw-8, y1, tw+8, 14, 3); oCtx.fill();
        oCtx.fillStyle = 'rgba(52,211,153,0.9)';
        oCtx.fillText(lbl, x2-tw-4, y1+11);
      }
    });
  }

  // Signs — blue overlay
  if (d.signs) {
    document.getElementById('s-signs').textContent = d.signs.length;
    d.signs.forEach(s => {
      const [x1,y1,x2,y2] = s.bbox;
      oCtx.strokeStyle = 'rgba(96,165,250,0.6)';
      oCtx.lineWidth = 2; oCtx.setLineDash([]);
      oCtx.strokeRect(x1,y1,x2-x1,y2-y1);
      oCtx.font = '400 9px "Fragment Mono", monospace';
      oCtx.fillStyle = 'rgba(0,0,0,0.55)';
      rr(oCtx, x1, y1-12, 32, 12, 2); oCtx.fill();
      oCtx.fillStyle = 'rgba(96,165,250,0.9)';
      oCtx.fillText('sign', x1+3, y1-2);
    });
  }

  // Tracked gaps
  if (d.tracked_gaps && d.tracked_gaps.length > 0) {
    let open = 0;
    d.tracked_gaps.forEach(g => {
      const [x1,y1,x2,y2] = g.bbox;
      if (g.confirmed) {
        open++;
        oCtx.fillStyle = 'rgba(52,211,153,0.07)';
        oCtx.fillRect(x1,y1,x2-x1,y2-y1);
        oCtx.strokeStyle = 'rgba(52,211,153,0.6)';
        oCtx.lineWidth = 2; oCtx.setLineDash([]);
      } else {
        oCtx.strokeStyle = 'rgba(251,191,36,0.4)';
        oCtx.lineWidth = 1.5; oCtx.setLineDash([4,3]);
      }
      oCtx.strokeRect(x1,y1,x2-x1,y2-y1);
      oCtx.setLineDash([]);
      const cx=(x1+x2)/2, cy=(y1+y2)/2;
      oCtx.textAlign='center'; oCtx.font='400 10px "Fragment Mono",monospace';
      if (g.confirmed) {
        oCtx.fillStyle='rgba(52,211,153,0.8)';
        oCtx.fillText(g.median_width_meters?g.median_width_meters.toFixed(1)+'m':'OPEN',cx,cy+4);
      } else {
        oCtx.fillStyle='rgba(251,191,36,0.65)';
        oCtx.fillText(g.duration.toFixed(1)+'s',cx,cy+4);
      }
      oCtx.textAlign='start';
    });
    document.getElementById('s-gaps').textContent = open;
  } else if (d.gap_bboxes) {
    oCtx.strokeStyle='rgba(251,191,36,0.25)'; oCtx.lineWidth=1; oCtx.setLineDash([3,3]);
    d.gap_bboxes.forEach(g=>{const[x1,y1,x2,y2]=g;oCtx.strokeRect(x1,y1,x2-x1,y2-y1);});
    oCtx.setLineDash([]);
  }

  // Pipeline state
  if (d.pipeline_state) pipeHud.textContent = d.pipeline_state;

  // GPS
  if (d.lat && d.lng) {
    emit('scene', `frame at <em>${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</em>  scene:${d.scene_valid?'<span class="hi">valid</span>':'<span class="err">invalid</span>'}  pipeline:<em>${d.pipeline_state||'—'}</em>`);
  }

  // Log detections
  if (d.raw_detections && d.raw_detections.length > 0) {
    // Detection strip
    let chips = '';
    for (const r of d.raw_detections) {
      const c = r.accepted ? 'ok' : 'rej';
      chips += `<span class="det-chip ${c}">${esc(r.cls)} <span class="pct">${(r.confidence*100)|0}%</span></span>`;
    }
    detStrip.innerHTML = chips;

    // Stream each detection
    for (const r of d.raw_detections) {
      if (r.accepted) {
        emit('vehicle', `<em>${esc(r.cls)}</em> detected  conf:<span class="hi">${(r.confidence*100)|0}%</span>  track:${r.track_id||'—'}`);
      } else {
        emit('rej', `${esc(r.cls)} rejected  conf:${(r.confidence*100)|0}%  reason:<span class="err">${esc(r.reason)}</span>`);
      }
    }
  }

  // Tracked gaps log
  if (d.tracked_gaps) {
    for (const g of d.tracked_gaps) {
      if (g.confirmed) {
        const w = g.median_width_meters ? g.median_width_meters.toFixed(1)+'m' : '—';
        emit('gap', `gap T${g.left_track_id}–T${g.right_track_id} <span class="hi">CONFIRMED</span>  width:<em>${w}</em>  dur:${g.duration.toFixed(1)}s`);
      } else {
        emit('gap', `gap T${g.left_track_id}–T${g.right_track_id}  accumulating <span class="warn">${g.duration.toFixed(1)}s</span>/2.0s`);
      }
    }
  }

  // Sign rules — persist HUD for 10s after last reading
  const sr = d.sign_rules;
  if (sr && (sr.combined_summary || sr.summary)) {
    const txt = sr.combined_summary || sr.summary;
    document.getElementById('sign-text').textContent = txt;
    const parts = [sr.combined_hours||sr.hours, sr.combined_price||sr.price].filter(Boolean);
    document.getElementById('sign-detail').textContent = parts.join(' · ');
    signHud.style.display = 'block';
    if (signHudTimer) clearTimeout(signHudTimer);
    signHudTimer = setTimeout(() => { signHud.style.display = 'none'; signHudTimer = null; }, 10000);
    emit('sign', `sign decoded: <em>${esc(txt)}</em>`);
  }

  // Confirmed
  if (d.confirmed_block) {
    confirmedCount++;
    document.getElementById('s-spots').textContent = confirmedCount;
    const cb = d.confirmed_block;
    emit('spot', `<em>SPOT CONFIRMED</em>  gaps:<span class="hi">${cb.gap_count}</span>  segment:<em>${esc(cb.segment_id)}</em>  at ${cb.lat?.toFixed(5)},${cb.lng?.toFixed(5)}`, true);
    toast.textContent = '● spot confirmed — ' + cb.gap_count + ' gap' + (cb.gap_count>1?'s':'');
    toast.classList.add('on');
    setTimeout(() => toast.classList.remove('on'), 3000);
  }
}

// ── Terminal ──
function emit(tag, msg, highlight) {
  const now = new Date();
  const ts = now.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const ms = String(now.getMilliseconds()).padStart(3,'0').slice(0,1);
  const el = document.createElement('div');
  el.className = 'line' + (highlight ? ' confirmed' : '');
  el.innerHTML = `<span class="ts">${ts}.${ms}</span><span class="tag ${tag}">${tag}</span><span class="msg">${msg}</span>`;
  term.appendChild(el);
  lineCount++;
  while (lineCount > MAX_LINES) { term.removeChild(term.firstChild); lineCount--; }
  term.scrollTop = term.scrollHeight;
}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

connect();
</script>
</body>
</html>
