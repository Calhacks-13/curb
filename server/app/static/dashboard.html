<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curb — Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fragment+Mono&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: #fafafa; color: #000;
  display: flex; height: 100vh;
}

/* Map */
#map-wrap { flex: 1; min-width: 0; }
#map { width: 100%; height: 100%; }

/* Sidebar */
#sidebar {
  width: 420px; overflow-y: auto;
  padding: 24px;
  border-left: 1px solid rgba(0,0,0,0.08);
  background: #fff;
}

h1 {
  font-size: 18px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 20px;
}

/* Stats */
.stats { display: flex; gap: 10px; margin-bottom: 24px; }
.stat {
  flex: 1; text-align: center;
  background: #fafafa;
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 12px;
  padding: 14px 10px;
}
.stat .num {
  font-size: 32px; font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.stat .label {
  font-family: 'Fragment Mono', monospace;
  font-size: 10px; color: rgba(0,0,0,0.4);
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-top: 4px;
}

/* Table */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid rgba(0,0,0,0.08);
  font-family: 'Fragment Mono', monospace;
  font-size: 10px; font-weight: 400;
  color: rgba(0,0,0,0.4);
  text-transform: uppercase; letter-spacing: 0.08em;
}
td {
  padding: 10px;
  border-bottom: 1px solid rgba(0,0,0,0.05);
  vertical-align: middle;
}

@media (hover: hover) {
  tr:hover td { background: rgba(0,0,0,0.02); }
}

/* Badges */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-family: 'Fragment Mono', monospace;
  font-size: 11px; font-weight: 600;
}
.badge-gaps { background: rgba(34,197,94,0.1); color: #16a34a; }
.badge-conf { background: rgba(59,130,246,0.1); color: #2563eb; }

/* Footer */
#last-update {
  font-family: 'Fragment Mono', monospace;
  font-size: 10px; color: rgba(0,0,0,0.3);
  margin-top: 16px;
  letter-spacing: 0.04em;
}

/* Leaflet popup overrides */
.leaflet-popup-content-wrapper {
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

@media (max-width: 810px) {
  body { flex-direction: column; }
  #map-wrap { height: 50vh; }
  #sidebar { width: 100%; border-left: none; border-top: 1px solid rgba(0,0,0,0.08); }
}
</style>
</head>
<body>
<div id="map-wrap"><div id="map"></div></div>
<div id="sidebar">
  <h1>Curb Live</h1>
  <div class="stats">
    <div class="stat"><div class="num" id="total-blocks">0</div><div class="label">Blocks</div></div>
    <div class="stat"><div class="num" id="total-gaps">0</div><div class="label">Total Gaps</div></div>
  </div>
  <table>
    <thead><tr><th>Segment</th><th>Gaps</th><th>Conf</th><th>Sign Rules</th><th>Time</th></tr></thead>
    <tbody id="block-rows"></tbody>
  </table>
  <div id="last-update"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([37.7749, -122.4194], 15);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19,
}).addTo(map);

const markers = {};
const tbody = document.getElementById('block-rows');
const totalBlocksEl = document.getElementById('total-blocks');
const totalGapsEl = document.getElementById('total-gaps');
const lastUpdateEl = document.getElementById('last-update');

async function poll() {
  try {
    const resp = await fetch('/dashboard/recent');
    const data = await resp.json();
    const blocks = data.blocks || [];

    totalBlocksEl.textContent = blocks.length;
    totalGapsEl.textContent = blocks.reduce((s, b) => s + (b.gap_count || 0), 0);

    tbody.innerHTML = '';
    Object.keys(markers).forEach(k => { map.removeLayer(markers[k]); delete markers[k]; });

    let bounds = [];

    blocks.forEach(b => {
      const tr = document.createElement('tr');
      const signText = b.sign_rules ? b.sign_rules.summary || '--' : '--';
      const time = b.confirmed_at ? new Date(b.confirmed_at).toLocaleTimeString() : '--';
      tr.innerHTML = `
        <td style="font-family:'Fragment Mono',monospace;font-size:12px">${b.segment_id || '--'}</td>
        <td><span class="badge badge-gaps">${b.gap_count}</span></td>
        <td><span class="badge badge-conf">${((b.confidence || 0) * 100).toFixed(0)}%</span></td>
        <td>${signText}</td>
        <td style="font-family:'Fragment Mono',monospace;font-size:12px;color:rgba(0,0,0,0.5)">${time}</td>
      `;
      tbody.appendChild(tr);

      if (b.lat && b.lng) {
        const m = L.circleMarker([b.lat, b.lng], {
          radius: 7,
          fillColor: '#22c55e',
          color: '#fff',
          weight: 1.5,
          fillOpacity: 0.85,
        }).addTo(map).bindPopup(`<b>${b.segment_id}</b><br>${b.gap_count} gaps<br>${signText}`);
        markers[b.segment_id] = m;
        bounds.push([b.lat, b.lng]);
      }
    });

    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17 });
    }

    lastUpdateEl.textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch {}
}

poll();
setInterval(poll, 2000);
</script>
</body>
</html>
