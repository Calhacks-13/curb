<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>curb</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
  }
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  .content {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    z-index: 10; pointer-events: none;
  }
  .logo {
    font-size: clamp(56px, 10vw, 120px);
    font-weight: 200;
    letter-spacing: 0.12em;
    color: #fff;
    text-transform: lowercase;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content">
  <div class="logo">curb</div>
</div>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
let W, H, dpr;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
resize();

const vsrc = `
  attribute vec3 aPos;
  attribute vec4 aColor;
  uniform mat4 uMVP;
  uniform float uPointSize;
  varying vec4 vColor;
  void main() {
    gl_Position = uMVP * vec4(aPos, 1.0);
    gl_PointSize = uPointSize * (1.0 / gl_Position.w) * 180.0;
    vColor = aColor;
  }
`;
const fsrc = `
  precision mediump float;
  varying vec4 vColor;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    if (d > 0.5) discard;
    float a = smoothstep(0.5, 0.3, d);
    gl_FragColor = vec4(vColor.rgb, vColor.a * a);
  }
`;

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsrc));
gl.linkProgram(prog);
gl.useProgram(prog);

const aPos = gl.getAttribLocation(prog, 'aPos');
const aColor = gl.getAttribLocation(prog, 'aColor');
const uMVP = gl.getUniformLocation(prog, 'uMVP');
const uPointSize = gl.getUniformLocation(prog, 'uPointSize');

gl.enableVertexAttribArray(aPos);
gl.enableVertexAttribArray(aColor);
gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
gl.clearColor(0, 0, 0, 1);

// Matrix helpers
function perspective(fov, aspect, near, far) {
  const f = 1 / Math.tan(fov / 2), nf = 1 / (near - far);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(far+near)*nf,-1, 0,0,2*far*near*nf,0]);
}

function lookAt(eye, center, up) {
  const zx=eye[0]-center[0], zy=eye[1]-center[1], zz=eye[2]-center[2];
  let l=1/Math.sqrt(zx*zx+zy*zy+zz*zz);
  const z0=zx*l, z1=zy*l, z2=zz*l;
  const x0=up[1]*z2-up[2]*z1, x1=up[2]*z0-up[0]*z2, x2=up[0]*z1-up[1]*z0;
  l=Math.sqrt(x0*x0+x1*x1+x2*x2);
  const xx=x0/l, xy=x1/l, xz=x2/l;
  const y0=z1*xz-z2*xy, y1=z2*xx-z0*xz, y2=z0*xy-z1*xx;
  return new Float32Array([
    xx,y0,z0,0, xy,y1,z1,0, xz,y2,z2,0,
    -(xx*eye[0]+xy*eye[1]+xz*eye[2]),
    -(y0*eye[0]+y1*eye[1]+y2*eye[2]),
    -(z0*eye[0]+z1*eye[1]+z2*eye[2]), 1
  ]);
}

function mul(a, b) {
  const o = new Float32Array(16);
  for (let i=0;i<4;i++) for (let j=0;j<4;j++)
    o[j*4+i]=a[i]*b[j*4]+a[4+i]*b[j*4+1]+a[8+i]*b[j*4+2]+a[12+i]*b[j*4+3];
  return o;
}

// Scene geometry
const ROAD_HW = 3.0;
const CAR_L = 2.2, CAR_W3 = 0.9, CAR_H = 0.55;
const GAP_L = 2.6, BUMPER_G = 0.6, STREET_LEN = 80;

const positions = [], colors = [], slots = [];

function pt(x,y,z,r,g,b,a) { positions.push(x,y,z); colors.push(r,g,b,a); }

function buildScene() {
  positions.length = 0; colors.length = 0; slots.length = 0;
  const hx = STREET_LEN / 2;

  // Road dust
  for (let i=0;i<6000;i++)
    pt((Math.random()-0.5)*STREET_LEN, 0, (Math.random()-0.5)*ROAD_HW*2, 1,1,1, 0.02+Math.random()*0.012);

  // White dashed center line
  let dx = -hx+1;
  while (dx < hx-1) {
    for (let i=0;i<12;i++)
      pt(dx+Math.random()*1.2, 0.01, (Math.random()-0.5)*0.06, 1,1,1, 0.28+Math.random()*0.1);
    dx += 2.8;
  }

  // Curb edges
  for (const cz of [-ROAD_HW, ROAD_HW])
    for (let i=0;i<1000;i++)
      pt((Math.random()-0.5)*STREET_LEN, 0.06+Math.random()*0.03, cz+(Math.random()-0.5)*0.1, 1,1,1, 0.12+Math.random()*0.06);

  // Sidewalks
  for (let i=0;i<8000;i++) {
    const far = Math.random()<0.5;
    pt((Math.random()-0.5)*STREET_LEN*1.2, 0,
      far ? ROAD_HW+0.3+Math.random()*7 : -ROAD_HW-0.3-Math.random()*7,
      1,1,1, 0.012+Math.random()*0.008);
  }

  // Cross street at center + main street both extend far
  const crossRoadHW = 1.8;
  const crossLen = 80;
  for (const dir of [-1, 1]) {
    const zStart = dir === 1 ? ROAD_HW + 0.5 : -crossLen/2;
    const zEnd = dir === 1 ? crossLen/2 : -ROAD_HW - 0.5;
    // Road surface
    for (let i=0;i<1500;i++)
      pt((Math.random()-0.5)*crossRoadHW*2, 0, zStart+Math.random()*(zEnd-zStart), 1,1,1, 0.02+Math.random()*0.012);
    // Dashed center line
    let dz = zStart;
    while (dz < zEnd) {
      for (let i=0;i<8;i++)
        pt((Math.random()-0.5)*0.06, 0.01, dz+Math.random()*0.8, 1,1,1, 0.22+Math.random()*0.08);
      dz += 2.2;
    }
    // Curb edges
    for (const side of [-1,1])
      for (let i=0;i<400;i++)
        pt(side*crossRoadHW+(Math.random()-0.5)*0.1, 0.06+Math.random()*0.03, zStart+Math.random()*(zEnd-zStart), 1,1,1, 0.1+Math.random()*0.05);
  }

  // Slots
  for (const side of [-1,1]) {
    const parkZ = side*ROAD_HW + side*(CAR_W3/2+0.25);
    let cx = -hx+1+Math.random();
    while (cx < hx-1) {
      const isGap = Math.random()<0.25;
      const len = isGap ? GAP_L*(0.9+Math.random()*0.2) : CAR_L*(0.85+Math.random()*0.3);
      slots.push({x:cx, len, z:parkZ, w:CAR_W3, side, type:isGap?'gap':'car', scanned:false, scanTime:0, scanState:''});
      cx += len + BUMPER_G + Math.random()*0.3;
    }
  }

  // Car points
  for (const s of slots) {
    if (s.type!=='car') continue;
    const den = Math.floor(s.len*s.w*24);
    for (let i=0;i<den;i++) {
      let lx=Math.random(), lz=Math.random(), ly=Math.random();
      if (Math.random()<0.5) {
        const e=Math.floor(Math.random()*6);
        if(e===0)lx=Math.random()*0.05; else if(e===1)lx=0.95+Math.random()*0.05;
        else if(e===2)lz=Math.random()*0.06; else if(e===3)lz=0.94+Math.random()*0.06;
        else if(e===4)ly=0.95+Math.random()*0.05; else ly=Math.random()*0.05;
      }
      pt(s.x+lx*s.len, ly*CAR_H, s.z-s.w/2+lz*s.w, 1,1,1, 0.06+Math.random()*0.04);
    }
    for (let i=0;i<Math.floor(den*0.25);i++)
      pt(s.x+(0.12+Math.random()*0.76)*s.len, CAR_H*(0.8+Math.random()*0.2), s.z+(Math.random()-0.5)*s.w*0.5, 1,1,1, 0.1+Math.random()*0.06);
  }

  // Gap points
  for (const s of slots) {
    if (s.type!=='gap') continue;
    s._si = positions.length/3;
    for (let i=0;i<Math.floor(s.len*s.w*3);i++)
      pt(s.x+Math.random()*s.len, Math.random()*0.02, s.z+(Math.random()-0.5)*s.w, 1,1,1, 0.012);
    s._ei = positions.length/3;
  }
}

buildScene();

const posBuf = gl.createBuffer(), colBuf = gl.createBuffer();
let posArr = new Float32Array(positions), colArr = new Float32Array(colors);
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, posArr, gl.STATIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.bufferData(gl.ARRAY_BUFFER, colArr, gl.DYNAMIC_DRAW);
let total = posArr.length/3;

const scanners = [
  {x:-STREET_LEN/2-5, z:-1.2, vx:0.06, range:5},
  {x:STREET_LEN/2+5, z:1.2, vx:-0.055, range:4.8},
];

let t = 0;

// Camera orbit params
const CAM_RADIUS = 28;
const CAM_HEIGHT = 16;
const CAM_SPEED = 0.0003; // very slow orbit

function draw() {
  t++;
  gl.clear(gl.COLOR_BUFFER_BIT);

  // Slow orbiting camera, angled down
  const angle = t * CAM_SPEED;
  const ex = Math.sin(angle) * CAM_RADIUS;
  const ez = Math.cos(angle) * CAM_RADIUS;
  const eye = [ex, CAM_HEIGHT, ez];
  const center = [0, 0, 0];
  const up = [0, 1, 0];

  const proj = perspective(Math.PI/5.5, W/H, 0.1, 200);
  const view = lookAt(eye, center, up);
  const mvp = mul(proj, view);

  gl.uniformMatrix4fv(uMVP, false, mvp);
  gl.uniform1f(uPointSize, dpr * 0.8);

  // Scanners
  const hx = STREET_LEN/2;
  for (const s of scanners) {
    s.x += s.vx;
    if (s.x>hx+6) s.x=-hx-6;
    if (s.x<-hx-6) s.x=hx+6;
    for (const slot of slots) {
      if (slot.type!=='gap') continue;
      const dx=s.x-(slot.x+slot.len/2), dz=s.z-slot.z;
      if (Math.sqrt(dx*dx+dz*dz)<s.range && !slot.scanned) {
        slot.scanned=true; slot.scanTime=t; slot.scanState=Math.random()<0.5?'open':'taken';
      }
    }
  }

  // Update gap colors
  let changed = false;
  for (const slot of slots) {
    if (slot.type!=='gap'||!slot.scanned) continue;
    const fade = Math.min((t-slot.scanTime)/50, 1);
    for (let i=slot._si;i<slot._ei;i++) {
      const ci=i*4;
      if (slot.scanState==='open') {
        colArr[ci]=72/255; colArr[ci+1]=220/255; colArr[ci+2]=150/255;
        colArr[ci+3]=fade*(0.4+0.15*Math.sin(t*0.025+i*0.3));
      } else {
        colArr[ci]=1; colArr[ci+1]=60/255; colArr[ci+2]=70/255;
        colArr[ci+3]=fade*0.3;
      }
    }
    changed=true;
    if (t-slot.scanTime>900) {
      slot.scanned=false;
      for (let i=slot._si;i<slot._ei;i++) {
        const ci=i*4;
        colArr[ci]=1; colArr[ci+1]=1; colArr[ci+2]=1; colArr[ci+3]=0.012;
      }
    }
  }

  if (changed) { gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, colArr); }

  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.vertexAttribPointer(aColor, 4, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.POINTS, 0, total);

  requestAnimationFrame(draw);
}

draw();
window.addEventListener('resize', () => {
  resize(); buildScene();
  posArr=new Float32Array(positions); colArr=new Float32Array(colors);
  total=posArr.length/3;
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, posArr, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, colBuf); gl.bufferData(gl.ARRAY_BUFFER, colArr, gl.DYNAMIC_DRAW);
});
</script>
</body>
</html>
